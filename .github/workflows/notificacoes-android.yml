name: Resumo diário Android

on:
  schedule:
    - cron: '0 22 * * *' # 19h em Brasília; o GitHub pode iniciar com atraso.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Apenas conferir, sem enviar
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: notificacoes-android
  cancel-in-progress: false

jobs:
  resumo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Executar resumo com identidade do GitHub
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vizinho-certo-notificacoes")"
          token="$(printf '%s' "$response" | jq --raw-output '.value')"
          test -n "$token" && test "$token" != 'null'
          echo "::add-mask::$token"
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${token}" \
            --header 'Content-Type: application/json' \
            --request POST --data "{\"dryRun\":${DRY_RUN}}" \
            'https://www.vizinhocerto.com.br/api/posts?rota=notificacoes-diarias'
