name: Coletar eventos de São João da Boa Vista

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: coletar-eventos-sao-joao
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter identidade do GitHub e executar coleta
        shell: bash
        env:
          OIDC_AUDIENCE: vizinho-certo-eventos
          COLETOR_URL: https://www.vizinhocerto.com.br/api/eventos-coletar
        run: |
          set -euo pipefail
          token_response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(printf '%s' "${token_response}" | jq --raw-output '.value')"
          test -n "${oidc_token}"
          test "${oidc_token}" != "null"
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${oidc_token}" \
            "${COLETOR_URL}"
