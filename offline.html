<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2D6A4F">
  <title>Sem internet | Vizinho Certo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#FEFAE0;color:#1B1B1B;font-family:system-ui,-apple-system,sans-serif}.card{width:100%;max-width:420px;padding:28px;border:1px solid #D9D0BE;border-radius:18px;background:white;text-align:center}.icon{font-size:48px}h1{margin:12px 0 8px;color:#2D6A4F;font-family:Georgia,serif;font-size:28px}p{margin:0 0 20px;color:#6B6B6B;line-height:1.55}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2D6A4F;color:white;font-weight:700;font-size:15px;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>Você está sem internet</h1>
    <p>Assim que a conexão voltar, tente novamente para carregar as novidades da sua vizinhança.</p>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
